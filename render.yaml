services:
  # Backend
  - type: web
    name: belagavi-yatri-api
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: belagavi-yatri-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: belagavi-yatri-redis
          property: connectionString

  # Frontend
  - type: web
    name: belagavi-yatri
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://belagavi-yatri-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Redis
  - type: keyvalue
    name: belagavi-yatri-redis
    plan: free
    ipAllowList: []

databases:
  - name: belagavi-yatri-db
    plan: basic-256mb